name: Android Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: 4.7.2-stable
  GODOT_TEMPLATES_VERSION: 4.7.2.stable
  GODOT_EDITOR_SETTINGS_VERSION: "4.7"
  BUNDLETOOL_VERSION: 1.17.2

jobs:
  export-android:
    name: Build Android App Bundle
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Run Android Validation Unit Tests
        run: python -m unittest discover -s scripts -p "test_*.py"

      - name: Install Android SDK Components
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "${SDKMANAGER}" ]; then
            SDKMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" -path '*/bin/sdkmanager' | sort -V | tail -n 1)"
          fi
          if [ -z "${SDKMANAGER}" ] || [ ! -x "${SDKMANAGER}" ]; then
            echo "::error::sdkmanager was not found under ANDROID_HOME=${ANDROID_HOME}."
            exit 1
          fi
          set +o pipefail
          yes | "${SDKMANAGER}" --licenses
          set -o pipefail
          "${SDKMANAGER}" "platforms;android-36" "build-tools;36.1.0" "ndk;29.0.14206865"

      - name: Download and Install Godot
        run: |
          wget "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip "Godot_v${GODOT_VERSION}_linux.x86_64.zip" -d /tmp
          sudo mv "/tmp/Godot_v${GODOT_VERSION}_linux.x86_64" /usr/local/bin/godot
          chmod +x /usr/local/bin/godot

          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_TEMPLATES_VERSION}"
          wget "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz"
          unzip "Godot_v${GODOT_VERSION}_export_templates.tpz" -d /tmp
          mv /tmp/templates/* "$HOME/.local/share/godot/export_templates/${GODOT_TEMPLATES_VERSION}/"

      - name: Generate Dummy Debug Keystore
        run: |
          keytool -genkey -v -keystore game/debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" -storepass android -keypass android

      - name: Import Assets
        run: godot --headless --path ./game --editor --quit

      - name: Run Headless Tests
        run: godot --headless --path ./game -s res://tests/test_runner.gd

      - name: Configure Editor Settings
        run: |
          mkdir -p ~/.config/godot
          cat <<EOF > ~/.config/godot/editor_settings-${GODOT_EDITOR_SETTINGS_VERSION}.tres
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$PWD/game/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Make Gradle Wrapper Executable
        run: chmod +x game/android/build/gradlew

      - name: Export Android AAB
        run: godot --verbose --headless --path ./game --export-release "Android" Game\.aab

      - name: Verify Android Build Inputs
        run: |
          echo "Godot editor:"
          godot --version
          echo "Android template version:"
          cat game/android/.build_version
          echo "Gradle wrapper:"
          grep '^distributionUrl=' game/android/build/gradle/wrapper/gradle-wrapper.properties
          echo "Android Gradle config:"
          grep -E 'androidGradlePlugin|compileSdk|targetSdk|buildTools|kotlinVersion|ndkVersion' game/android/build/config.gradle
          python scripts/validate_android_16kb.py game/android/build/libs/release/*.aar

      - name: Decode Release Keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > release.keystore

      - name: Sign App Bundle
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: ./game
          signingKeyBase64: ${{ secrets.KEYSTORE_BASE64 }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEYSTORE_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "36.1.0"

      - name: Verify 16 KB Native Library Support
        shell: bash
        run: |
          set -euo pipefail

          ZIPALIGN="$(find "${ANDROID_HOME}/build-tools" -type f -name zipalign | sort -V | tail -n 1)"
          if [ -z "${ZIPALIGN}" ]; then
            echo "::error::zipalign was not found under ANDROID_HOME; cannot validate APK native-library page alignment."
            exit 1
          fi

          curl -L -o bundletool.jar "https://github.com/google/bundletool/releases/download/${BUNDLETOOL_VERSION}/bundletool-all-${BUNDLETOOL_VERSION}.jar"
          mkdir -p android-16kb-validation

          shopt -s nullglob
          aabs=(game/*.aab)
          if [ "${#aabs[@]}" -eq 0 ]; then
            echo "::error::No AAB files were produced in ./game."
            exit 1
          fi

          for aab in "${aabs[@]}"; do
            echo "Validating AAB native ELF alignment: ${aab}"
            python scripts/validate_android_16kb.py "${aab}"

            apks="android-16kb-validation/$(basename "${aab%.aab}").apks"
            java -jar bundletool.jar build-apks --bundle="${aab}" --output="${apks}" --mode=universal

            echo "Validating generated APK payload alignment: ${apks}"
            python scripts/validate_android_16kb.py --strict-zip "${apks}"

            extract_dir="android-16kb-validation/$(basename "${aab%.aab}")"
            mkdir -p "${extract_dir}"
            unzip -q -o "${apks}" -d "${extract_dir}"

            while IFS= read -r -d '' apk; do
              echo "Running zipalign -c -P 16 -v 4 on ${apk}"
              "${ZIPALIGN}" -c -P 16 -v 4 "${apk}"
            done < <(find "${extract_dir}" -type f -name '*.apk' -print0)
          done

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Game-Android
          path: |
            ./game/*.aab
            ./game/*-native-debug-symbols.zip
            ./game/android/build/outputs/mapping/release/mapping.txt

      - name: Upload Release Assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            ./game/*.aab
            ./game/*-native-debug-symbols.zip
            ./game/android/build/outputs/mapping/release/mapping.txt

